# 仓库目录名带 -main 后缀（发布包名不含），N999 是环境产物而非代码问题。
# BLE001/S110：质量层为增强功能，刻意用宽异常兜底不阻断消息主链，属有意设计。
# 测试需先把仓库父目录插入 sys.path 才能导入插件包，导入必须置于该样板之后，
# 故 E402 在 tests/ 内是固有形态（样板收敛到包 __init__ 的方案实测不可行：
# Python 3.14 discover 不带 -t 时按顶层模块导入测试文件，不执行包 __init__）。
line-length = 120

[lint]
ignore = ["BLE001", "S110", "N999"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
